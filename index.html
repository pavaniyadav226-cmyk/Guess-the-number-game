
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Number Guess Challenge</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="container">
        <header>
            <div class="logo">🎯</div>

            <h1>Number Guess Challenge</h1>

            <p class="subtitle">
                Test your luck and challenge your brain!
            </p>
        </header>

        <section class="game-card">

            <div class="game-info">
                <span>🎮 GAME MODE</span>
                <span class="level">EASY</span>
            </div>

            <h2>Guess the Secret Number</h2>

            <p class="instruction">
                I'm thinking of a number between
                <strong>1 and 100</strong>.
            </p>

            <div class="number-display" id="numberDisplay">
                ?
            </div>

            <p id="message" class="message" aria-live="polite">
                Make your first guess!
            </p>

            <div class="input-group">

                <input
                    type="number"
                    id="guessInput"
                    placeholder="Enter your guess"
                    min="1"
                    max="100"
                    step="1"
                >

                <button id="guessBtn">
                    Check Guess
                </button>

            </div>

            <div class="stats">

                <div class="stat-box">
                    <span>Attempts</span>
                    <h3 id="attempts">0</h3>
                </div>

                <div class="stat-box">
                    <span>Best Score</span>
                    <h3 id="bestScore">--</h3>
                </div>

            </div>

            <div class="actions">

                <button id="hintBtn" class="hint-btn">
                    💡 Get Hint
                </button>

                <button id="restartBtn" class="restart-btn">
                    ↻ New Game
                </button>

            </div>

            <p id="hintMessage" class="hint-message"
               aria-live="polite"></p>

        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}">
    </script>

</body>
</html>
